<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Sherlock" />
<title>Sherlock Notes</title>
<!--
  SHERLOCK NOTES — LIVE (Supabase-connected)
  ============================================
  - Login with your Supabase user (avibakka@gmail.com).
  - On login, pulls your notes from Supabase.
  - Every tick / add / edit / delete writes straight back to Supabase.
  - Reopen anytime (phone or laptop) -> latest data loads.
  RLS protects the data; the anon key below is safe to be public.
-->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #f6f5f1; --card: #fffdf8; --ink: #23211c; --ink-soft: #6b675d;
    --line: #e4e1d8; --work: #2f6f7e; --personal: #9a6a3a; --done: #a8a499;
    --accent: #1f1d18; --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.05);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: "Georgia","Iowan Old Style",serif; background: var(--bg); color: var(--ink);
    min-height: 100vh; -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 16px 90px; }

  /* ---- LOGIN ---- */
  .login-screen {
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .login-card {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    box-shadow: var(--shadow); padding: 32px 28px; width: 100%; max-width: 360px; text-align: center;
  }
  .login-card .brand { font-size: 28px; font-weight: 700; }
  .login-card .brand small { display:block; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: var(--ink-soft); margin-top: 4px; font-weight:400; }
  .login-card p { font-family:-apple-system,system-ui,sans-serif; font-size: 13px; color: var(--ink-soft); margin: 14px 0 20px; }
  .field { text-align: left; margin-bottom: 12px; }
  .field label { font-family:-apple-system,system-ui,sans-serif; font-size: 12px; color: var(--ink-soft); display:block; margin-bottom: 4px; }
  .field input {
    width: 100%; font-family:-apple-system,system-ui,sans-serif; font-size: 15px; padding: 11px 12px;
    border: 1.5px solid var(--line); border-radius: 10px; background:#fff; color: var(--ink); outline: none;
  }
  .field input:focus { border-color: var(--accent); }
  .login-err { font-family:-apple-system,system-ui,sans-serif; font-size:12.5px; color:#b23b3b; min-height: 16px; margin-bottom: 8px; }

  .btn {
    font-family:-apple-system,system-ui,sans-serif; font-size: 14px; cursor: pointer;
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    padding: 10px 16px; border-radius: 999px; transition: all .15s ease;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.solid { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn.full { width: 100%; padding: 12px; }
  .btn.mini { padding: 5px 12px; font-size: 12px; }

  /* ---- HEADER ---- */
  header { position: sticky; top: 0; z-index: 20; background: rgba(246,245,241,.9); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  .head-inner { max-width: 1100px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .brand-h { font-size: 20px; font-weight: 700; }
  .brand-h small { font-weight: 400; color: var(--ink-soft); font-size: 12px; letter-spacing: .5px; text-transform: uppercase; margin-left: 6px; }
  .count { color: var(--ink-soft); font-size: 13px; font-family:-apple-system,system-ui,sans-serif; }
  .spacer { flex: 1; }
  .sync { font-family:-apple-system,system-ui,sans-serif; font-size: 12px; color: var(--ink-soft); display:flex; align-items:center; gap:6px; }
  .dot-sync { width: 8px; height: 8px; border-radius: 50%; background: #cfcabd; }
  .dot-sync.ok { background: #4a9; } .dot-sync.busy { background: #e0a83b; } .dot-sync.err { background: #c55; }

  /* ---- BOARD ---- */
  .board { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 22px; }
  @media (max-width: 760px){ .board { grid-template-columns: 1fr; } }
  .col-head { display: flex; align-items: baseline; gap: 10px; padding-bottom: 8px; margin-bottom: 12px; border-bottom: 2px solid var(--ink); }
  .col-head .dot { width: 10px; height: 10px; border-radius: 50%; }
  .col-W .dot { background: var(--work); } .col-P .dot { background: var(--personal); }
  .col-head h2 { font-size: 16px; letter-spacing: .5px; text-transform: uppercase; }
  .col-head span { color: var(--ink-soft); font-size: 12px; font-family:-apple-system,system-ui,sans-serif; }

  .sub { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 13px 15px; margin-bottom: 13px; box-shadow: var(--shadow); }
  .sub-title { font-size: 14px; font-weight: 700; margin-bottom: 9px; display: flex; align-items: center; gap: 8px; }
  .col-W .sub-title:before { content:""; width:6px; height:16px; border-radius:3px; background:var(--work); }
  .col-P .sub-title:before { content:""; width:6px; height:16px; border-radius:3px; background:var(--personal); }

  .item { display: flex; align-items: flex-start; gap: 10px; padding: 9px 2px; border-bottom: 1px dashed var(--line); font-family:-apple-system,system-ui,sans-serif; font-size: 14px; }
  .item:last-child { border-bottom: none; }
  .check { margin-top: 1px; width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--ink-soft); cursor: pointer; flex: none; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #fff; transition: all .15s; }
  .check.on { background: var(--work); border-color: var(--work); }
  .col-P .check.on { background: var(--personal); border-color: var(--personal); }
  .item-body { flex: 1; min-width: 0; }
  .item-id { font-size: 11px; color: var(--ink-soft); font-weight: 700; letter-spacing: .4px; }
  .item-text { line-height: 1.4; word-break: break-word; }
  .item.done .item-text { text-decoration: line-through; color: var(--done); }
  .tag { display: inline-block; margin-top: 4px; font-size: 11px; background: #fbeede; color: #97651f; padding: 2px 8px; border-radius: 6px; }
  .row-actions { display: flex; gap: 4px; flex: none; }
  .ic { cursor: pointer; border: none; background: none; font-size: 15px; color: var(--ink-soft); padding: 4px 6px; border-radius: 6px; }
  .ic:hover { background: var(--bg); color: var(--ink); }
  .ic.danger { color: #b23b3b; font-weight: 700; }

  .inline-input { width: 100%; font-family:-apple-system,system-ui,sans-serif; font-size: 14px; padding: 9px 10px; border: 1.5px solid var(--accent); border-radius: 8px; background:#fff; color: var(--ink); outline: none; }
  .inline-actions { display: flex; gap: 6px; margin-top: 6px; }
  .inline-add { margin-top: 8px; }
  .add-btn { margin-top: 8px; font-size: 12.5px; color: var(--ink-soft); background: none; border: 1px dashed var(--line); border-radius: 8px; padding: 8px 10px; cursor: pointer; width: 100%; font-family:-apple-system,system-ui,sans-serif; }
  .add-btn:hover { border-color: var(--accent); color: var(--ink); }
  .add-sub { margin-top: 4px; font-size: 13px; color: var(--ink-soft); background: none; border: none; cursor: pointer; padding: 6px; font-family:-apple-system,system-ui,sans-serif; }
  .add-sub:hover { color: var(--ink); text-decoration: underline; }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--accent); color:#fff; padding: 10px 18px; border-radius: 999px; font-family:-apple-system,system-ui,sans-serif; font-size:13px; opacity:0; transition: all .25s; z-index:60; }
  .toast.show { opacity:1; transform: translateX(-50%) translateY(0); }
  .loading { text-align:center; padding: 60px 20px; font-family:-apple-system,system-ui,sans-serif; color: var(--ink-soft); }
  .completed-wrap { margin-top: 28px; border-top: 1px solid var(--line); padding-top: 14px; }
  .completed-bar { width: 100%; text-align: left; background: none; border: none; cursor: pointer; font-family:-apple-system,system-ui,sans-serif; font-size: 13px; color: var(--ink-soft); padding: 8px 4px; border-radius: 8px; }
  .completed-bar:hover { background: var(--card); color: var(--ink); }
  .completed-list { margin-top: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px 14px; }
  .citem { display: flex; align-items: center; gap: 10px; padding: 7px 2px; border-bottom: 1px dashed var(--line); font-family:-apple-system,system-ui,sans-serif; font-size: 13px; }
  .citem:last-child { border-bottom: none; }
  .citem-id { font-size: 11px; color: var(--ink-soft); font-weight: 700; flex: none; }
  .citem-text { flex: 1; color: var(--done); text-decoration: line-through; word-break: break-word; }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
  // ---- CONFIG ----
  const SUPABASE_URL = "https://ziopdhrugyacvjwwfbho.supabase.co";
  const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inppb3BkaHJ1Z3lhY3Zqd3dmYmhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NTYwMjQsImV4cCI6MjA5NjEzMjAyNH0.JphtT7Vec4Dm_yPHtyeW21T680aQ0kE8R7h2UxeVo1g";

  const app = document.getElementById('app');
  const $ = (s,r=document)=>r.querySelector(s);

  let sb = null;
  let notes = [];
  let ui = { mode:null, showCompleted:false };
  let session = null;

  // ---- wait for the Supabase library, then boot ----
  bootWhenReady();
  function bootWhenReady(tries){
    tries = tries || 0;
    const lib = window.supabase;
    if(lib && typeof lib.createClient === 'function'){
      sb = lib.createClient(SUPABASE_URL, SUPABASE_ANON);
      init();
      return;
    }
    if(tries > 50){ // ~5s
      app.innerHTML = `<div class="loading">Couldn't load the Supabase library.<br>This is normal inside the Claude preview (network is restricted).<br>It will work once the app is hosted (Netlify/Vercel).<br><br><button class="btn" onclick="location.reload()">Retry</button></div>`;
      return;
    }
    setTimeout(()=>bootWhenReady(tries+1), 100);
  }
  async function init(){
    const { data } = await sb.auth.getSession();
    if(data.session){ session = data.session; await loadAndRender(); }
    else renderLogin();
  }

  // ---- LOGIN ----
  function renderLogin(err){
    app.innerHTML = `
      <div class="login-screen">
        <div class="login-card">
          <div class="brand">Sherlock<small>Notes</small></div>
          <p>Sign in to load your notes.</p>
          <div class="login-err">${err||''}</div>
          <div class="field"><label>Email</label><input id="email" type="email" autocomplete="username" /></div>
          <div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" /></div>
          <button class="btn solid full" id="loginBtn">Sign in</button>
        </div>
      </div>`;
    const doLogin = async ()=>{
      const email = $('#email').value.trim();
      const password = $('#password').value;
      if(!email || !password){ renderLogin("Enter email and password."); return; }
      $('#loginBtn').textContent = "Signing in…"; $('#loginBtn').disabled = true;
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if(error){ renderLogin(error.message); return; }
      session = data.session; await loadAndRender();
    };
    $('#loginBtn').onclick = doLogin;
    $('#password').onkeydown = e=>{ if(e.key==='Enter') doLogin(); };
    $('#email').focus();
  }

  async function logout(){ await sb.auth.signOut(); session=null; notes=[]; renderLogin(); }

  // ---- DATA ----
  async function loadAndRender(){
    app.innerHTML = `<div class="loading">Loading your notes…</div>`;
    const { data, error } = await sb.from('notes').select('*').order('cat').order('item_id');
    if(error){ app.innerHTML = `<div class="loading">Couldn't load: ${error.message}<br><br><button class="btn" onclick="location.reload()">Retry</button></div>`; return; }
    notes = data || [];
    render();
  }

  function setSync(state){ // 'ok' | 'busy' | 'err'
    const d = $('#dotSync'); const t = $('#syncTxt');
    if(!d) return;
    d.className = 'dot-sync ' + (state==='busy'?'busy':state==='err'?'err':'ok');
    if(t) t.textContent = state==='busy'?'Saving…':state==='err'?'Save failed':'Saved';
  }

  // next provisional item_id within a sub-project
  function nextId(cat, sub){
    const ex = notes.filter(n=>n.cat===cat && n.sub===sub);
    let subNum = null;
    if(ex.length){ const m = ex[0].item_id.match(/^([WP]\d+)\./); subNum = m?m[1]:null; }
    if(!subNum){
      // brand-new sub-project: find next sub number in this category
      let mx=0; notes.filter(n=>n.cat===cat).forEach(n=>{ const m=n.item_id.match(/^[WP](\d+)\./); if(m) mx=Math.max(mx,+m[1]); });
      subNum = cat + (mx+1);
    }
    let mi=0; notes.forEach(n=>{ const m=n.item_id.match(new RegExp('^'+subNum+'\\.(\\d+)$')); if(m) mi=Math.max(mi,+m[1]); });
    return subNum + '.' + (mi+1);
  }

  // ---- RENDER ----
  function render(){
    const active = notes.filter(n=>n.status==='open').length;
    const done = notes.filter(n=>n.status==='done').length;
    app.innerHTML = `
      <header><div class="head-inner">
        <div class="brand-h">Sherlock <small>Notes</small></div>
        <span class="count">${active} active · ${done} done</span>
        <div class="spacer"></div>
        <span class="sync"><span class="dot-sync ok" id="dotSync"></span><span id="syncTxt">Saved</span></span>
        <button class="btn mini" id="refreshBtn" title="Refresh from server">↻ Refresh</button>
        <button class="btn mini" id="logoutBtn">Sign out</button>
      </div></header>
      <div class="wrap"><div class="board">
        ${renderCol('W','Work')}
        ${renderCol('P','Personal')}
      </div>
      ${renderCompleted()}
      </div>`;
    $('#refreshBtn').onclick = ()=>{ setSync('busy'); loadAndRender(); };
    $('#logoutBtn').onclick = logout;
    wire();
  }

  function renderCompleted(){
    const doneItems = notes.filter(n=>n.status==='done');
    if(!doneItems.length) return '';
    const open = ui.showCompleted;
    return `<div class="completed-wrap">
      <button class="completed-bar" data-act="toggleCompleted">
        <span>${open?'▾':'▸'} Completed (${doneItems.length})</span>
      </button>
      ${open ? `<div class="completed-list">
        ${doneItems.sort((a,b)=> a.item_id<b.item_id?-1:1).map(n=>`
          <div class="citem">
            <span class="citem-id">${n.item_id}</span>
            <span class="citem-text">${esc(n.text)}</span>
            <button class="ic" data-act="toggle" data-id="${n.id}" title="Reopen">↺</button>
          </div>`).join('')}
      </div>` : ''}
    </div>`;
  }

  function renderCol(cat, name){
    const subs = [...new Set(notes.filter(n=>n.cat===cat).map(n=>n.sub))];
    const cnt = notes.filter(n=>n.cat===cat && n.status==='open').length;
    const addingSub = (ui.mode==='addsub' && ui.cat===cat);
    return `<section class="col-${cat}">
      <div class="col-head"><span class="dot"></span><h2>${name}</h2><span>${cnt} active</span></div>
      ${subs.map(s=>renderSub(cat,s)).join('')}
      ${addingSub
        ? `<div class="sub inline-add">
             <input class="inline-input" id="subNameInput" placeholder="New sub-project name…" />
             <input class="inline-input" id="subItemInput" placeholder="First item text…" style="margin-top:6px" />
             <div class="inline-actions"><button class="btn solid mini" data-act="addSubSave" data-cat="${cat}">Create</button><button class="btn mini" data-act="cancel">Cancel</button></div>
           </div>`
        : `<button class="add-sub" data-act="addSubStart" data-cat="${cat}">+ new sub-project</button>`}
    </section>`;
  }

  function renderSub(cat, sub){
    let items = notes.filter(n=>n.cat===cat && n.sub===sub && n.status==='open');
    const adding = (ui.mode==='add' && ui.cat===cat && ui.sub===sub);
    // hide a sub-project card entirely if it has no open items and we're not adding to it
    if(items.length===0 && !adding) return '';
    return `<div class="sub">
      <div class="sub-title">${esc(sub)}</div>
      ${items.map(renderItem).join('')}
      ${adding
        ? `<div class="inline-add"><input class="inline-input" id="addInput" placeholder="New item text…" />
             <div class="inline-actions"><button class="btn solid mini" data-act="addSave" data-cat="${cat}" data-sub="${escA(sub)}">Add</button><button class="btn mini" data-act="cancel">Cancel</button></div></div>`
        : `<button class="add-btn" data-act="addStart" data-cat="${cat}" data-sub="${escA(sub)}">+ add item</button>`}
    </div>`;
  }

  function renderItem(n){
    if(ui.mode==='edit' && ui.id===n.id){
      return `<div class="item"><div class="check ${n.status==='done'?'on':''}">${n.status==='done'?'✓':''}</div>
        <div class="item-body"><div class="item-id">${n.item_id}</div>
          <input class="inline-input" id="editInput" value="${escA(n.text)}" />
          <div class="inline-actions"><button class="btn solid mini" data-act="editSave" data-id="${n.id}">Save</button><button class="btn mini" data-act="cancel">Cancel</button></div>
        </div></div>`;
    }
    const del = (ui.mode==='del' && ui.id===n.id);
    return `<div class="item ${n.status==='done'?'done':''}">
      <div class="check ${n.status==='done'?'on':''}" data-act="toggle" data-id="${n.id}">${n.status==='done'?'✓':''}</div>
      <div class="item-body"><div class="item-id">${n.item_id}</div><div class="item-text">${esc(n.text)}</div>${n.tag?`<span class="tag">${esc(n.tag)}</span>`:''}</div>
      <div class="row-actions">
        ${del
          ? `<button class="ic danger" data-act="delConfirm" data-id="${n.id}">delete?</button><button class="ic" data-act="cancel">no</button>`
          : `<button class="ic" data-act="edit" data-id="${n.id}">✎</button><button class="ic" data-act="del" data-id="${n.id}">✕</button>`}
      </div></div>`;
  }

  function wire(){
    app.querySelectorAll('[data-act]').forEach(el=>{
      el.onclick = ()=>{
        const id=el.getAttribute('data-id'), cat=el.getAttribute('data-cat'), sub=el.getAttribute('data-sub');
        switch(el.getAttribute('data-act')){
          case 'toggle': toggleDone(id); break;
          case 'edit': ui={mode:'edit',id}; render(); break;
          case 'editSave': saveEdit(id); break;
          case 'del': ui={mode:'del',id}; render(); break;
          case 'delConfirm': delItem(id); break;
          case 'addStart': ui={mode:'add',cat,sub}; render(); break;
          case 'addSave': saveAdd(cat,sub); break;
          case 'addSubStart': ui={mode:'addsub',cat}; render(); break;
          case 'addSubSave': saveAddSub(cat); break;
          case 'toggleCompleted': ui.showCompleted = !ui.showCompleted; render(); break;
          case 'cancel': ui={mode:null, showCompleted:ui.showCompleted}; render(); break;
        }
      };
    });
    const ei=$('#editInput'); if(ei){ ei.focus(); ei.setSelectionRange(ei.value.length,ei.value.length); ei.onkeydown=e=>{ if(e.key==='Enter')saveEdit(ui.id); if(e.key==='Escape'){ui={mode:null, showCompleted:ui.showCompleted};render();} }; }
    const ai=$('#addInput'); if(ai){ ai.focus(); ai.onkeydown=e=>{ if(e.key==='Enter')saveAdd(ui.cat,ui.sub); if(e.key==='Escape'){ui={mode:null, showCompleted:ui.showCompleted};render();} }; }
    const sn=$('#subNameInput'); if(sn){ sn.focus(); sn.onkeydown=e=>{ if(e.key==='Enter')$('#subItemInput').focus(); if(e.key==='Escape'){ui={mode:null, showCompleted:ui.showCompleted};render();} }; }
    const si=$('#subItemInput'); if(si){ si.onkeydown=e=>{ if(e.key==='Enter')saveAddSub(ui.cat); if(e.key==='Escape'){ui={mode:null, showCompleted:ui.showCompleted};render();} }; }
  }

  // ---- ACTIONS (each writes to Supabase, then reflects) ----
  async function toggleDone(id){
    const n = notes.find(x=>x.id===id); if(!n) return;
    const newStatus = n.status==='done'?'open':'done';
    n.status = newStatus; render(); setSync('busy');
    const { error } = await sb.from('notes').update({ status:newStatus }).eq('id', id);
    if(error){ setSync('err'); toast('Save failed — reloading'); return loadAndRender(); }
    setSync('ok');
  }
  async function saveEdit(id){
    const n = notes.find(x=>x.id===id); if(!n) return;
    const v = $('#editInput')? $('#editInput').value.trim() : '';
    if(v==='' || v===n.text){ ui={mode:null, showCompleted:ui.showCompleted}; render(); return; }
    n.text=v; ui={mode:null, showCompleted:ui.showCompleted}; render(); setSync('busy');
    const { error } = await sb.from('notes').update({ text:v }).eq('id', id);
    if(error){ setSync('err'); toast('Save failed — reloading'); return loadAndRender(); }
    setSync('ok');
  }
  async function delItem(id){
    notes = notes.filter(x=>x.id!==id); ui={mode:null, showCompleted:ui.showCompleted}; render(); setSync('busy');
    const { error } = await sb.from('notes').delete().eq('id', id);
    if(error){ setSync('err'); toast('Delete failed — reloading'); return loadAndRender(); }
    setSync('ok');
  }
  async function saveAdd(cat, sub){
    const v = $('#addInput')? $('#addInput').value.trim() : '';
    if(v===''){ ui={mode:null, showCompleted:ui.showCompleted}; render(); return; }
    const item_id = nextId(cat, sub);
    ui={mode:null, showCompleted:ui.showCompleted}; setSync('busy');
    const row = { item_id, cat, sub, text:v, status:'open', tag:'', owner: session.user.id };
    const { data, error } = await sb.from('notes').insert(row).select().single();
    if(error){ setSync('err'); toast('Add failed — reloading'); return loadAndRender(); }
    notes.push(data); render(); setSync('ok');
  }
  async function saveAddSub(cat){
    const name = $('#subNameInput')? $('#subNameInput').value.trim() : '';
    const v = $('#subItemInput')? $('#subItemInput').value.trim() : '';
    if(name===''){ ui={mode:null, showCompleted:ui.showCompleted}; render(); return; }
    if(v===''){ return; }
    const item_id = nextId(cat, name);
    ui={mode:null, showCompleted:ui.showCompleted}; setSync('busy');
    const row = { item_id, cat, sub:name, text:v, status:'open', tag:'', owner: session.user.id };
    const { data, error } = await sb.from('notes').insert(row).select().single();
    if(error){ setSync('err'); toast('Add failed — reloading'); return loadAndRender(); }
    notes.push(data); render(); setSync('ok');
  }

  // ---- utils ----
  let tT;
  function toast(m){ const e=$('#toast'); e.textContent=m; e.classList.add('show'); clearTimeout(tT); tT=setTimeout(()=>e.classList.remove('show'),2000); }
  function esc(s){ return (s+'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function escA(s){ return esc(s).replace(/'/g,'&#39;'); }
})();
</script>
</body>
</html>
